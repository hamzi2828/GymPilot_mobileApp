name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Web bundle
        run: npx expo export --platform web --output-dir /tmp/expo-web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com
